name: Keep scheduled automation active

on:
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: project-pepper-schedule-heartbeat
  cancel-in-progress: false

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Record monthly activity
        shell: bash
        run: |
          set -euo pipefail
          date -u +%Y-%m > .github/schedule-heartbeat
          if [[ -z "$(git status --porcelain -- .github/schedule-heartbeat)" ]]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/schedule-heartbeat
          git commit -m "Keep Project Pepper schedule active"
          git push
